[PHP]
upload_max_filesize = 512M
post_max_size = 512M
memory_limit = 512M
max_execution_time = 120
display_errors = Off
max_input_time = 60
max_input_vars = 1000
session.gc_maxlifetime = 1440
session.save_path = "/opt/alt/php82/var/lib/php/session"
zlib.output_compression = Off
